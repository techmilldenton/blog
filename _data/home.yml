hero:
  headline: "Code With Friends & Drinks"
  subheadline: "Join Denton's tech and startup community"
  button_text: "Join Us"
  button_url: "https://www.meetup.com/TechmillDenton/"
  background_image: "/media/openhack-800x600.jpg"

pillars:
  - title: Education
    description: "With our network of volunteers, we're teaching skills to students looking to learn industry standards, freelancers wanting to expand their skillset, and business owners integrating new technologies."
    image: "/media/28134057675_e0d6f09d23_k-495x400.jpg"
    image_alt: "Workshop class / UX"
    link: /education/
    button_text: Read More
  - title: Community
    description: "TechMill exists to support and educate our local tech and startup communities, but the key word here is \"community\". We promote inclusivity, diversity, and camaraderie throughout our organization and members."
    image: "/media/29542204554_bc5e0cb1a0_h-495x400.jpg"
    image_alt: "Bootstrap Denton Crowd"
    link: /community/
    button_text: Read More
  - title: Events
    description: "The best way to build community is by providing opportunities for people to meet their peers, learn new skills, and collaborate with each other. At TechMill, our goal is to facilitate a wide range of events for our members to attend and have fun."
    image: "/media/30170994015_aa65e26b87_h-495x400.jpg"
    image_alt: "Bootstrap Denton speaking"
    link: /events/
    button_text: View Events

