what_we_do:
  - icon: fa-tv
    title: Educational Workshops
    description: "Whether you want to learn how to code, run marketing campaigns, or integrate technology into your business — we run a wide range of workshops throughout the year."
  - icon: fa-calendar
    title: Regularly Scheduled
    description: "The key to building community is being consistent. Our calendar features not only unique events, but regular meetups that you can attend weekly and get to know the community."
  - icon: fa-heart
    title: Entrepreneur Support
    description: "Freelancers, small businesses, startups, and entrepreneurs alike — we aim to provide resources and support for all shapes and sizes."
  - icon: fa-wifi
    title: Online / Offline
    description: "It doesn't matter if you prefer to hang out in-person at our meetups, or online in our Slack group — there's always a way to meet your community and collaborate."

join:
  - title: Virtual
    description: "Join our community Slack to meet and chat with your fellow local tech enthusiasts."
    image: "/media/slack-495x400.jpg"
    image_alt: Slack
    link: "https://slack.techmill.co/"
    button_text: "Join our Slack"
  - title: Meetups
    description: "Find an upcoming event to see your fellow local tech enthusiasts in person."
    image: "/media/meetup-495x400.jpg"
    image_alt: Meetup.com
    link: "https://www.meetup.com/TechmillDenton"
    button_text: "Find an event"
  - title: Membership
    description: "To celebrate our first year offering memberships, 2017 membership is free if you attend 3 events this year."
    image: "/media/techmill-member-495x400.jpg"
    image_alt: TechMill Membership
    link: /events/
    button_text: "View Events"

