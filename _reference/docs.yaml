name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - "docs/**"
      - "src/**"
      - "scripts/generate-plugin-docs.js"
      - "typedoc.json"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/-1"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run docs:build

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Generate Jekyll config from template
        run: |
          # Start from the base config inside docs/
          cp docs/_config.base.yml docs/_config.yml

          # Append dynamic, repo-specific settings
          cat >> docs/_config.yml << 'EOF'

          # --- dynamically injected by GitHub Actions ---

          # Full origin for the site (e.g. https://datadog.github.io)
          url: "${{ steps.pages.outputs.origin }}"

          # Base path for this project site (e.g. /datadog-sales-engineer-chrome-extension)
          baseurl: "${{ steps.pages.outputs.base_path }}"

          # GitHub repository metadata
          repository: "${{ github.repository }}"

          aux_links:
            "View source on GitHub":
              - "${{ github.server_url }}/${{ github.repository }}"
            "Report an Issue":
              - "${{ github.server_url }}/${{ github.repository }}/issues/new"

          aux_links_new_tab: true

          gh_edit_link: true
          gh_edit_link_text: "Edit this page on GitHub"
          gh_edit_repository: "${{ github.server_url }}/${{ github.repository }}"
          gh_edit_branch: "${{ github.ref_name }}"
          gh_edit_source: "docs"
          gh_edit_view_mode: "edit"

          # Analytics (if available)
          google_analytics: ${{ secrets.GOOGLE_ANALYTICS_ID || 'null' }}
          EOF

          echo "Generated docs/_config.yml:"
          cat docs/_config.yml

      - name: Validate generated documentation
        run: |
          # Check that API docs were generated
          if [ ! -d "docs/api" ] || [ -z "$(ls -A docs/api)" ]; then
            echo "❌ API documentation not generated"
            exit 1
          fi

          # Check that plugin docs were generated
          if [ ! -d "docs/plugins" ] || [ -z "$(ls -A docs/plugins)" ]; then
            echo "❌ Plugin documentation not generated"
            exit 1
          fi

          echo "✅ Documentation validation passed"
          echo "API docs: $(ls -la docs/api | wc -l) files"
          echo "Plugin docs: $(ls -la docs/plugins | wc -l) files"

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
          future: false
          verbose: true

      - name: Test built site
        run: |
          # Check that main pages exist
          if [ ! -f "_site/index.html" ]; then
            echo "❌ Homepage not built"
            exit 1
          fi

          if [ ! -f "_site/api/index.html" ]; then
            echo "❌ API documentation not built"
            exit 1
          fi

          if [ ! -f "_site/plugins/index.html" ]; then
            echo "❌ Plugin registry not built"
            exit 1
          fi

          echo "✅ Site build validation passed"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post-deployment notification
        if: success()
        run: |
          echo "🚀 Documentation successfully deployed!"
          echo "📖 Site URL: ${{ steps.deployment.outputs.page_url }}"
