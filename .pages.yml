# Pages CMS configuration
# https://pagescms.org/docs/configuration/

media:
  input: media
  output: /media
  categories: [image]

content:
  - name: posts
    label: Posts
    type: collection
    path: _posts
    filename: "{fields.date}-{fields.slug}"
    view:
      fields: [title, date, author]
    fields:
      - { name: layout, type: string, hidden: true, default: post }
      - { name: title,  label: Title,  type: string, required: true }
      - { name: slug,   label: Slug,   type: string }
      - { name: date,   label: Date,   type: date,   required: true }
      - { name: author, label: Author, type: string }
      - { name: summary, label: Summary, type: text }
      - name: categories
        label: Categories
        type: select
        multiple: true
        options:
          values: [community, education, environment, events, news, projects]
      - name: tags
        label: Tags
        type: select
        multiple: true
        creatable: true
        options:
          values: []
      - name: body
        label: Body
        type: rich-text

  - name: pages
    label: Pages
    type: collection
    path: _pages
    filename: "{fields.slug}"
    view:
      fields: [title, permalink]
    fields:
      - { name: layout,    type: string, hidden: true, default: page }
      - { name: title,     label: Title,     type: string, required: true }
      - { name: slug,      label: Slug,      type: string }
      - { name: permalink, label: Permalink, type: string }
      - { name: summary,   label: Summary,   type: text }
      - name: body
        label: Body
        type: rich-text

  - name: home
    label: Homepage
    type: file
    path: _data/home.yml
    fields:
      - name: hero
        label: Hero Section
        type: object
        fields:
          - { name: headline,         label: Headline,         type: string }
          - { name: subheadline,      label: Subheadline,      type: string }
          - { name: button_text,      label: Button Text,      type: string }
          - { name: button_url,       label: Button URL,       type: string }
          - { name: background_image, label: Background Image, type: image }
      - name: pillars
        label: Pillars (Education/Community/Events)
        type: list
        fields:
          - { name: title,       label: Title,       type: string }
          - { name: description, label: Description, type: text }
          - { name: image,       label: Image,       type: image }
          - { name: image_alt,   label: Alt Text,    type: string }
          - { name: link,        label: Link,        type: string }
          - { name: button_text, label: Button Text, type: string }
      - name: initiatives
        label: Initiatives Grid
        type: list
        fields:
          - { name: title,    label: Title,    type: string }
          - { name: category, label: Category, type: string }
          - { name: image,    label: Image,    type: image }
          - { name: link,     label: Link,     type: string }
      - name: what_we_do
        label: What We Do (Icon Boxes)
        type: list
        fields:
          - { name: icon,        label: "Font Awesome class (e.g. fa-tv)", type: string }
          - { name: title,       label: Title,       type: string }
          - { name: description, label: Description, type: text }
      - name: join
        label: How to Join (Cards)
        type: list
        fields:
          - { name: title,       label: Title,       type: string }
          - { name: description, label: Description, type: text }
          - { name: image,       label: Image,       type: image }
          - { name: image_alt,   label: Alt Text,    type: string }
          - { name: link,        label: Link,        type: string }
          - { name: button_text, label: Button Text, type: string }
      - name: partners
        label: Partners & Supporters
        type: list
        fields:
          - { name: name, label: Name, type: string }
          - { name: logo, label: Logo, type: image }
          - { name: url,  label: URL,  type: string }
      - name: cta
        label: CTA Banner
        type: object
        fields:
          - { name: headline,    label: Headline,    type: string }
          - { name: button_text, label: Button Text, type: string }
          - { name: button_url,  label: Button URL,  type: string }
      - name: footer
        label: Footer
        type: object
        fields:
          - { name: description, label: Description, type: text }
          - { name: address,     label: Address,     type: string }
          - { name: email,       label: Email,       type: string }
          - { name: copyright,   label: Copyright,   type: string }

  - name: navigation
    label: Navigation
    type: file
    path: _data/navigation.yml
    fields:
      - name: top
        label: Top Bar Links
        type: list
        fields:
          - { name: title, label: Title, type: string }
          - { name: url,   label: URL,   type: string }
      - name: main
        label: Main Nav Links
        type: list
        fields:
          - { name: title, label: Title, type: string }
          - { name: url,   label: URL,   type: string }
          - name: children
            label: Dropdown Items
            type: list
            fields:
              - { name: title, label: Title, type: string }
              - { name: url,   label: URL,   type: string }
      - name: social
        label: Social Links
        type: list
        fields:
          - { name: name, label: Name,            type: string }
          - { name: url,  label: URL,             type: string }
          - { name: icon, label: "FA icon class", type: string }
