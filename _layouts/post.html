---
layout: default
---

<main style="padding: 2rem 0 4rem;">
  <div class="container">
    <article>
      <header class="post-header">
        <h1 class="post-title">{{ page.title }}</h1>
        <div class="post-meta">
          {% if page.author %}<span><i class="fa-solid fa-user"></i> {{ page.author }}</span>{% endif %}
          <span><i class="fa-regular fa-calendar"></i> {{ page.date | date: '%B %d, %Y' }}</span>
          {% if page.categories %}<span><i class="fa-solid fa-folder"></i> {{ page.categories | join: ', ' }}</span>{% endif %}
        </div>
      </header>
      <div class="post-body">
        {{ content }}
      </div>
    </article>
  </div>
</main>
